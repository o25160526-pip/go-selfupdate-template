trigger:
  branches:
    include: [main]

pr:
  branches:
    include: [main]

pool:
  vmImage: ubuntu-latest

variables:
  GOMODCACHE: $(Pipeline.Workspace)/gomod
  GOCACHE: $(Pipeline.Workspace)/gobuild
  CGO_ENABLED: '0'

steps:
  - checkout: self
    fetchDepth: 0

  - task: GoTool@0
    inputs:
      version: '1.23.0'

  - task: Cache@2
    displayName: Cache Go modules
    inputs:
      key: 'gomod | "$(Agent.OS)" | go.mod'
      restoreKeys: 'gomod | "$(Agent.OS)"'
      path: $(GOMODCACHE)

  - task: Cache@2
    displayName: Cache Go build
    inputs:
      key: 'gobuild | "$(Agent.OS)" | go.mod | "$(Build.SourceVersion)"'
      restoreKeys: |
        gobuild | "$(Agent.OS)" | go.mod
        gobuild | "$(Agent.OS)"
      path: $(GOCACHE)

  - script: jq empty .github/build-config.json
    displayName: Validate repository build configuration

  - bash: |
      set -euo pipefail
      gofmt -w .
      go vet ./...
      CGO_ENABLED=1 go test ./... -race -count=1
    displayName: Test

  - bash: |
      set -euo pipefail
      export BUILD_CONFIG_FILE="${BUILD_CONFIG_FILE:-}"
      export VERSION="${VERSION:-}"
      bash scripts/ci-build.sh
    displayName: Build configured targets with fallback
    env:
      BUILD_CONFIG_FILE: $(BUILD_CONFIG_FILE)
      VERSION: $(VERSION)

  - publish: dist
    artifact: release-$(Build.BuildNumber)
    displayName: Publish build tracker and artifacts
