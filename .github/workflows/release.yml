name: Release

on:
  workflow_dispatch:

permissions:
  contents: write

env:
  CGO_ENABLED: "0"
  GOTOOLCHAIN: local

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Require signing secrets
        env:
          PRIVATE_KEY: ${{ secrets.UPDATE_PRIVATE_KEY }}
          PUBLIC_KEY: ${{ secrets.UPDATE_PUBLIC_KEY }}
        run: |
          test -n "$PRIVATE_KEY" || { echo "Missing UPDATE_PRIVATE_KEY"; exit 1; }
          test -n "$PUBLIC_KEY" || { echo "Missing UPDATE_PUBLIC_KEY"; exit 1; }

      - name: Generate version
        id: version
        run: go run ./tools/genversion -check-tags=true -github-output "$GITHUB_OUTPUT"

      - name: Test
        env:
          CGO_ENABLED: "1"
        run: go test ./... -race -count=1

      - name: Build from configured targets with fallback
        env:
          BUILD_CONFIG_FILE: ${{ vars.BUILD_CONFIG_FILE }}
          VERSION: ${{ steps.version.outputs.display }}
        run: bash scripts/ci-build.sh

      - name: Sign checksums
        env:
          APP_SIGNING_KEY: ${{ secrets.UPDATE_PRIVATE_KEY }}
        run: go run ./tools/sign -in dist/checksums.txt -out dist/checksums.txt.sig

      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: gh release create "$TAG" dist/* --draft --title "${{ steps.version.outputs.display }}" --generate-notes

      - name: Build previous-version probe
        env:
          PUBLIC_KEY: ${{ secrets.UPDATE_PUBLIC_KEY }}
        run: |
          go build -trimpath \
            -ldflags "-s -w -X 'github.com/o25160526-pip/go-selfupdate-template/internal/version.Current=1.00.0101.0000' -X 'github.com/o25160526-pip/go-selfupdate-template/internal/version.Channel=internal' -X 'github.com/o25160526-pip/go-selfupdate-template/internal/updater.PublicKeyPrimary=$PUBLIC_KEY'" \
            -o /tmp/app-probe ./cmd/app

      - name: Prove draft can self-update
        env:
          APP_CHANNEL: internal
          APP_UPDATE_TOKEN: ${{ github.token }}
          APP_CONFIG_DIR: /tmp/app-probe-config
          APP_CACHE_DIR: /tmp/app-probe-cache
          APP_GITHUB_OWNER: ${{ github.repository_owner }}
          APP_GITHUB_REPO: ${{ github.event.repository.name }}
          VERSION: ${{ steps.version.outputs.display }}
        run: |
          set -euo pipefail
          /tmp/app-probe update --silent --version "$VERSION"
          actual=$(/tmp/app-probe version --json | jq -r .version)
          test "$actual" = "$VERSION"

      - name: Publish only after smoke update succeeds
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: gh release edit "$TAG" --draft=false --latest
