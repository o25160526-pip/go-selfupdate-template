name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  GOTOOLCHAIN: local
  CGO_ENABLED: "0"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - name: Cache Go build output
        uses: actions/cache@v4
        with:
          path: ~/.cache/go-build
          key: go-build-${{ runner.os }}-${{ hashFiles('go.mod') }}-${{ github.sha }}
          restore-keys: |
            go-build-${{ runner.os }}-${{ hashFiles('go.mod') }}-
            go-build-${{ runner.os }}-
      - name: Verify repository build configuration
        run: jq empty .github/build-config.json
      - run: gofmt -w .
      - run: go vet ./...
      - name: Test every package with retained diagnostics
        shell: bash
        run: |
          set -o pipefail
          mkdir -p ci-logs
          go test ./... -count=1 -v 2>&1 | tee ci-logs/go-test.log
          status=${PIPESTATUS[0]}
          if [[ "$status" -ne 0 ]]; then
            {
              echo '### go test output'
              echo '```text'
              cat ci-logs/go-test.log
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            while IFS= read -r line; do
              safe=${line//'%'/'%25'}
              safe=${safe//$'\n'/'%0A'}
              echo "::error title=go test::$safe"
            done < ci-logs/go-test.log
          fi
          exit "$status"
      - name: Upload test diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: go-test-log-${{ github.sha }}
          path: ci-logs/go-test.log
          if-no-files-found: ignore

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - name: Build from configured targets with fallback
        env:
          BUILD_CONFIG_FILE: ${{ vars.BUILD_CONFIG_FILE }}
          VERSION: ${{ github.event.inputs.version || '' }}
        run: bash scripts/ci-build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: app-build-${{ github.sha }}
          path: dist/*
          if-no-files-found: error
