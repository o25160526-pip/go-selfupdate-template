name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  GOTOOLCHAIN: local
  CGO_ENABLED: "0"

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      CGO_ENABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Cache Go build output
        uses: actions/cache@v4
        with:
          path: ~/.cache/go-build
          key: go-build-${{ runner.os }}-${{ hashFiles('go.mod') }}-${{ github.sha }}
          restore-keys: |
            go-build-${{ runner.os }}-${{ hashFiles('go.mod') }}-
            go-build-${{ runner.os }}-
      - name: Verify repository build configuration
        run: jq empty .github/build-config.json
      - run: gofmt -w .
      - run: go vet ./...
      - name: Test packages with diagnostics
        shell: bash
        run: |
          set -uo pipefail
          failed=0
          while read -r package; do
            [[ -z "$package" ]] && continue
            echo "===== TEST $package ====="
            if ! output=$(go test -race -count=1 -v "$package" 2>&1); then
              failed=1
              printf '%s\n' "$output"
              while IFS= read -r line; do
                safe=${line//'%'/'%25'}
                safe=${safe//$'\n'/'%0A'}
                echo "::error title=go test failure::$safe"
              done <<< "$output"
            else
              printf '%s\n' "$output"
            fi
          done < <(go list ./...)
          exit "$failed"

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Build from configured targets with fallback
        env:
          BUILD_CONFIG_FILE: ${{ vars.BUILD_CONFIG_FILE }}
          VERSION: ${{ github.event.inputs.version || '' }}
        run: bash scripts/ci-build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: app-build-${{ github.sha }}
          path: dist/*
          if-no-files-found: error
