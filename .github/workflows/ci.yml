name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  GOTOOLCHAIN: local
  CGO_ENABLED: "0"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - name: Cache Go build output
        uses: actions/cache@v4
        with:
          path: ~/.cache/go-build
          key: go-build-${{ runner.os }}-${{ hashFiles('go.mod') }}-${{ github.sha }}
          restore-keys: |
            go-build-${{ runner.os }}-${{ hashFiles('go.mod') }}-
            go-build-${{ runner.os }}-
      - name: Verify repository build configuration
        run: jq empty .github/build-config.json
      - run: gofmt -w .
      - run: go vet ./...
      - name: Test packages separately
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p ci-logs
          failed=0
          while read -r package; do
            [[ -z "$package" ]] && continue
            file="ci-logs/$(echo "$package" | tr '/:' '__').log"
            echo "===== $package ====="
            if ! go test "$package" -count=1 -v >"$file" 2>&1; then
              failed=1
              tail -c 4000 "$file"
              msg=$(tail -c 1800 "$file" | tr '\n' ' ' | sed 's/%/%25/g; s/\r/%0D/g')
              echo "::error file=.github/workflows/ci.yml,line=1,title=failed package $package::$msg"
            else
              cat "$file"
            fi
          done < <(go list ./...)
          exit "$failed"
      - name: Upload test diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: go-test-logs-${{ github.sha }}
          path: ci-logs/
          if-no-files-found: ignore

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - name: Build from configured targets with fallback
        id: configured-build
        env:
          BUILD_CONFIG_FILE: ${{ vars.BUILD_CONFIG_FILE }}
          VERSION: ${{ github.event.inputs.version || '' }}
        shell: bash
        run: |
          set -o pipefail
          mkdir -p ci-logs
          bash -x scripts/ci-build.sh 2>&1 | tee ci-logs/build.log
          status=${PIPESTATUS[0]}
          if [[ "$status" -ne 0 ]]; then
            msg=$(tail -c 5000 ci-logs/build.log | tr '\n' ' ' | sed 's/%/%25/g; s/\r/%0D/g')
            echo "::error file=scripts/ci-build.sh,line=1,title=configured build failure::$msg"
          fi
          exit "$status"
      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs-${{ github.sha }}
          path: ci-logs/build.log
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        with:
          name: app-build-${{ github.sha }}
          path: dist/*
          if-no-files-found: error
